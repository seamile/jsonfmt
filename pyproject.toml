[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonfmt"
dynamic = ["version"]
requires-python = ">=3.11"
license = "MIT"
description = "A powerful tool for pretty-printing, querying and conversion JSON documents."
readme = "README.md"
keywords = ["json", "formatter", "pretty-print", "highlight", "jmespath"]
authors = [{ name = "Seamile", email = "lanhuermao@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: File Formats :: JSON",
    "Topic :: Printing",
    "Topic :: Utilities",
]
dependencies = [
    "defusedxml >= 0.7.1",
    "jmespath >= 1.1.0",
    "jsonpath-ng >= 1.14.0",
    "Pygments >= 2.21.0",
    "pyperclip >= 1.11.0",
    "pyyaml >= 6.0.3",
    "toml >= 0.10.2",
]

[dependency-groups]
dev = [
    "coverage",
    "iniconfig",
    "ipython>=9.17.1",
    "packaging",
    "pytest",
    "ruff",
]

[project.urls]
homepage = "https://github.com/seamile/jsonfmt"
repository = "https://github.com/seamile/jsonfmt"
documentation = "https://seamile.github.io/jsonfmt/"

[project.scripts]
jf = "jsonfmt.jsonfmt:main"

[tool.setuptools]
packages = ["jsonfmt"]

[tool.setuptools.dynamic]
version = { attr = "jsonfmt.__version__" }

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
preview = true
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
select = ["A", "B", "C4", "C90", "E", "F", "FURB", "I", "N", "PERF", "RUF", "S", "UP", "W"]
ignore = [
    "ambiguous-unicode-character-comment",
    "ambiguous-unicode-character-docstring",
    "ambiguous-unicode-character-string",
    "assert",
    "function-call-in-default-argument",
    "hardcoded-sql-expression",
    "lambda-assignment",
    "line-too-long",
    "module-import-not-at-top-of-file",
    "start-process-with-partial-path",
    "subprocess-popen-with-shell-equals-true",
    "subprocess-without-shell-equals-true",
    "suspicious-non-cryptographic-random-usage",
    "suspicious-pickle-import",
    "suspicious-pickle-usage",
    "suspicious-subprocess-import",
    "unused-async",
    "zip-without-explicit-strict",
]

[tool.ruff.format]
preview = true
quote-style = "single"
line-ending = "lf"
docstring-code-format = true
