[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonfmt"
dynamic = ["version"]
requires-python = ">=3.11"
license = "MIT"
description = "A powerful tool for pretty-printing, querying and conversion JSON documents."
readme = "README.md"
keywords = ["json", "formatter", "pretty-print", "highlight", "jmespath"]
authors = [{ name = "Seamile", email = "lanhuermao@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: File Formats :: JSON",
    "Topic :: Printing",
    "Topic :: Utilities",
]
dependencies = [
    "defusedxml >= 0.7.1",
    "jmespath >= 1.1.0",
    "jsonpath-ng >= 1.14.0",
    "Pygments >= 2.21.0",
    "pyperclip >= 1.11.0",
    "pyyaml >= 6.0.3",
    "toml >= 0.10.2",
]

[dependency-groups]
dev = [
    "coverage",
    "iniconfig",
    "ipython>=9.17.1",
    "packaging",
    "pytest",
    "ruff",
]

[project.urls]
homepage = "https://github.com/seamile/jsonfmt"
repository = "https://github.com/seamile/jsonfmt"
documentation = "https://seamile.github.io/jsonfmt/"

[project.scripts]
jf = "jsonfmt.jsonfmt:main"

[tool.setuptools]
packages = ["jsonfmt"]

[tool.setuptools.dynamic]
version = { attr = "jsonfmt.__version__" }

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "single"
